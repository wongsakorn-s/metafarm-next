name: Deploy staging
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: metafarm-staging
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run gen
      - run: bun run check
      - run: bun run test
      - run: bun scripts/verify-deploy-target.ts staging
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      - run: bun run db:migrate
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      - run: bun run build
      - run: bunx wrangler deploy --config wrangler.staging.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
