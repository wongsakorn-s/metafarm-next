name: Deploy production
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: metafarm-production
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: bun run gen
      - run: bun run check
      - run: bun run test
      # Build and bundle before migrating, so a failed build never leaves a migrated database
      # behind an older Worker.
      - run: bun run build
      - run: bunx wrangler deploy --config wrangler.jsonc --dry-run
      - run: bun scripts/verify-deploy-target.ts production
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      - run: bun run db:migrate
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      - run: bunx wrangler deploy --config wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
